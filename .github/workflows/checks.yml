name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js && node --check static/platform.js && node --check static/i18n.js && node --check static/roles.js && node --check static/data-entry.js && node --check static/timetable.js && node --check static/school-calendar.js
      - run: node tests/test_i18n.cjs
