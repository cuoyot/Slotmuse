services:
  academia:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - academia-data:/app/data
    restart: unless-stopped
volumes:
  academia-data:
